<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - LedgerSpace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container" id="login-wrapper" style="display: none;">
        <div class="auth-card">
            <h1 style="color: var(--primary);">LedgerSpace</h1>
            <p style="color: var(--text-muted); margin-top: 8px;">Track your income and expenses securely.</p>
            
            <button id="login-btn" class="btn-google">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="20" alt="Google">
                Sign in with Google
            </button>
        </div>
    </div>

    <script type="module">
        import { auth, db, provider } from './firebase-config.js';
        import { signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { ref, get } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const loginWrapper = document.getElementById('login-wrapper');

        document.getElementById('login-btn').addEventListener('click', () => {
            signInWithPopup(auth, provider).catch(error => alert(error.message));
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                get(ref(db, `users/${user.uid}/profile/onboardingComplete`)).then((snapshot) => {
                    if (snapshot.exists() && snapshot.val() === true) {
                        window.location.replace('index.html');
                    } else {
                        window.location.replace('onboarding.html');
                    }
                });
            } else {
                loginWrapper.style.display = 'flex';
            }
        });
    </script>
</body>
</html>
