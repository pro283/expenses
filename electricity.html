<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electricity Saver - Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header class="dashboard-header">
    <div class="logo">⚡ Electricity Saver</div>
    <a href="dashboard.html" class="btn btn-secondary">← Back to Dashboard</a>
    <button id="logoutBtn" class="btn btn-outline">Logout</button>
  </header>

  <main class="dashboard-main">
    <div class="electricity-settings">
      <div class="card">
        <h3>Electricity Rate</h3>
        <div class="form-group">
          <label for="unitRate">Price per unit (PKR / kWh)</label>
          <input type="number" id="unitRate" min="0" step="0.01" value="30" required>
        </div>
        <div class="form-group">
          <label for="daysInMonth">Days in month</label>
          <input type="number" id="daysInMonth" min="1" max="31" value="30" required>
        </div>
      </div>
      <div class="card">
        <h3>Add Appliance</h3>
        <form id="applianceForm">
          <input type="hidden" id="applianceId">
          <div class="form-group">
            <label for="applianceName">Name</label>
            <input type="text" id="applianceName" required>
          </div>
          <div class="form-group">
            <label for="applianceWatts">Power (Watts)</label>
            <input type="number" id="applianceWatts" min="1" step="1" required>
          </div>
          <div class="form-group">
            <label for="applianceHours">Hours per day</label>
            <input type="number" id="applianceHours" min="0.1" step="0.1" required>
          </div>
          <button type="submit" class="btn btn-primary" id="saveApplianceBtn">Add Appliance</button>
        </form>
      </div>
    </div>

    <div class="summary-cards" id="electricitySummary">
      <div class="card">
        <h3>Total Consumption</h3>
        <p id="totalConsumption">0 kWh</p>
      </div>
      <div class="card">
        <h3>Total Cost</h3>
        <p id="totalCost">PKR 0</p>
      </div>
      <div class="card">
        <h3>Highest Consumer</h3>
        <p id="highestConsumer">-</p>
      </div>
    </div>

    <div class="charts-container">
      <div class="chart-card">
        <h3>Energy Consumption by Appliance</h3>
        <canvas id="applianceChart"></canvas>
      </div>
    </div>

    <section class="data-section">
      <div class="section-header">
        <h2>Appliances List</h2>
      </div>
      <ul id="applianceList" class="data-list"></ul>
    </section>
  </main>

  <script src="firebase-config.js"></script>
  <script src="common.js"></script>
  <script src="electricity.js"></script>
</body>
</html>
