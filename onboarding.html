<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome - Setup</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style> .form-group { margin-bottom: 16px; text-align: left; } .form-group label { display: block; margin-bottom: 8px; font-weight: 500; } .form-group input { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; } </style>
</head>
<body>
    <div class="auth-container">
        <div class="wizard-card">
            
            <!-- Step 1: Income -->
            <div id="step-1" class="wizard-step active">
                <h2>Step 1: Your Income Sources</h2>
                <p style="color: var(--text-muted); margin-bottom: 24px;">Enter your estimated monthly income.</p>
                <div class="form-group"><label>Salary (Rs)</label><input type="number" id="inc-salary" value="0"></div>
                <div class="form-group"><label>Agricultural Land (Rs)</label><input type="number" id="inc-agri" value="0"></div>
                <div class="form-group"><label>Rental (Rs)</label><input type="number" id="inc-rental" value="0"></div>
                <button class="btn" style="width: 100%; margin-top: 16px;" onclick="nextStep(2)">Next: Expenses</button>
            </div>

            <!-- Step 2: Select Expenses -->
            <div id="step-2" class="wizard-step">
                <h2>Step 2: Select Your Expenses</h2>
                <p style="color: var(--text-muted); margin-bottom: 16px;">Check the bills and fees you pay monthly.</p>
                <div class="checkbox-grid" id="expense-checkboxes"></div>
                <div style="display: flex; gap: 12px; margin-top: 16px;">
                    <button class="btn" style="background: var(--text-muted);" onclick="nextStep(1)">Back</button>
                    <button class="btn" style="flex: 1;" onclick="buildExpenseInputs()">Next: Enter Amounts</button>
                </div>
            </div>

            <!-- Step 3: Enter Expense Amounts -->
            <div id="step-3" class="wizard-step">
                <h2>Step 3: Expense Amounts</h2>
                <p style="color: var(--text-muted); margin-bottom: 16px;">Enter the Rs amount for your selected expenses.</p>
                <div id="expense-inputs-container"></div>
                <div style="display: flex; gap: 12px; margin-top: 24px;">
                    <button class="btn" style="background: var(--text-muted);" onclick="nextStep(2)">Back</button>
                    <button class="btn" style="flex: 1;" id="finish-btn">Finish Setup</button>
                </div>
            </div>

        </div>
    </div>

    <script type="module">
        import { auth, db, getStoredMonth } from './firebase-config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { ref, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        let currentUser = null;
        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = 'login.html';
            currentUser = user;
        });

        const commonExpenses = [
            { id: 'Electricity', type: 'utilities' }, { id: 'Gas', type: 'utilities' }, 
            { id: 'Water', type: 'utilities' }, { id: 'Ptcl', type: 'utilities' },
            { id: 'Milk', type: 'utilities' }, { id: 'Grocery', type: 'utilities' },
            { id: 'Flat Instalment', type: 'utilities' }, { id: 'Car Fuel/Indrive', type: 'utilities' },
            { id: 'M.Rohaan', type: 'school' }, { id: 'Hamna Meerab', type: 'school' }, { id: 'Abdullah', type: 'school' }
        ];

        const checkGrid = document.getElementById('expense-checkboxes');
        commonExpenses.forEach(exp => {
            checkGrid.innerHTML += `
                <label class="checkbox-item">
                    <input type="checkbox" value="${exp.id}" data-type="${exp.type}" checked> ${exp.id}
                </label>`;
        });

        window.nextStep = (step) => {
            document.querySelectorAll('.wizard-step').forEach(el => el.classList.remove('active'));
            document.getElementById(`step-${step}`).classList.add('active');
        };

        window.buildExpenseInputs = () => {
            const container = document.getElementById('expense-inputs-container');
            container.innerHTML = '';
            const checkboxes = document.querySelectorAll('#expense-checkboxes input:checked');
            
            checkboxes.forEach(cb => {
                container.innerHTML += `
                    <div class="form-group expense-entry" data-name="${cb.value}" data-type="${cb.dataset.type}">
                        <label>${cb.value} (Rs)</label>
                        <input type="text" class="exp-amt" placeholder="Amount (e.g. 12500+5500)">
                    </div>`;
            });
            nextStep(3);
        };

        document.getElementById('finish-btn').addEventListener('click', async () => {
            document.getElementById('finish-btn').innerText = "Saving...";
            const month = getStoredMonth();
            const updates = {};
            
            updates[`users/${currentUser.uid}/profile/onboardingComplete`] = true;
            updates[`users/${currentUser.uid}/profile/salary`] = document.getElementById('inc-salary').value;
            updates[`users/${currentUser.uid}/profile/agri`] = document.getElementById('inc-agri').value;
            updates[`users/${currentUser.uid}/profile/rental`] = document.getElementById('inc-rental').value;

            let time = Date.now();
            if(document.getElementById('inc-salary').value > 0) updates[`users/${currentUser.uid}/months/${month}/income/${time++}`] = {name: 'Salary', amount: document.getElementById('inc-salary').value};
            if(document.getElementById('inc-agri').value > 0) updates[`users/${currentUser.uid}/months/${month}/income/${time++}`] = {name: 'Agricultural Land', amount: document.getElementById('inc-agri').value};
            if(document.getElementById('inc-rental').value > 0) updates[`users/${currentUser.uid}/months/${month}/income/${time++}`] = {name: 'Rental', amount: document.getElementById('inc-rental').value};

            document.querySelectorAll('.expense-entry').forEach(entry => {
                const name = entry.dataset.name;
                const type = entry.dataset.type;
                const amt = entry.querySelector('.exp-amt').value || "0";
                updates[`users/${currentUser.uid}/months/${month}/${type}/${time++}`] = {name: name, amount: amt};
            });

            await update(ref(db), updates);
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
